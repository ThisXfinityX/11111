<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>線上明信片與 QR Code 產生器</title>
  <!-- 引入 QRCode 產生器套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 1120px;
      width: 100%;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel, .preview-area {
      background: var(--card);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    h1 { font-size: 1.35rem; margin: 0 0 16px; }
    .group { margin-bottom: 14px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="file"], select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 12px; align-items: center; }
    .row > div { flex: 1; }
    input[type="color"] {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      padding: 2px;
    }
    input[type="range"] { width: 100%; }
    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    button:hover { background: var(--primary-hover); }
    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      background: #e2e8f0;
    }
    .hint { font-size: 0.82rem; color: #64748b; margin-top: 10px; }
    #hidden-qr { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 控制面板 -->
  <div class="panel">
    <h1>📮 明信片 & QR Code 製作</h1>

    <div class="group">
      <label>1. 選擇風景照片</label>
      <input type="file" id="imageInput" accept="image/*" />
    </div>

    <div class="group">
      <label>2. 濾鏡效果</label>
      <select id="filterSelect">
        <option value="blur_sharpen" selected>模糊 + 銳化（柔和明信片風）</option>
        <option value="none">原圖無濾鏡</option>
        <option value="vintage">暖色復古風</option>
        <option value="vivid">鮮豔高對比</option>
        <option value="grayscale">經典黑白</option>
      </select>
    </div>

    <div class="group">
      <label>3. 下方明信片文字</label>
      <input type="text" id="textInput" value="旅行中的美好風景 — Postcard" />
    </div>

    <div class="group row">
      <div>
        <label>文字大小 (<span id="sizeVal">32</span>px)</label>
        <input type="range" id="fontSizeInput" min="18" max="54" value="32" />
      </div>
      <div>
        <label>文字顏色</label>
        <input type="color" id="textColorInput" value="#ffffff" />
      </div>
    </div>

    <div class="group">
      <label>4. QR Code 內容（網址或文字）</label>
      <input type="text" id="qrInput" value="https://github.com" placeholder="留空則不顯示 QR Code" />
    </div>

    <button id="downloadBtn">下載 postcard.jpg (800×600)</button>
  </div>

  <!-- 畫布預覽區 -->
  <div class="preview-area">
    <canvas id="postcardCanvas" width="800" height="600"></canvas>
    <p class="hint">輸出解析度固定為 800 × 600 px（JPEG 格式）</p>
  </div>
</div>

<div id="hidden-qr"></div>

<script>
  const canvas = document.getElementById("postcardCanvas");
  const ctx = canvas.getContext("2d");

  const imageInput = document.getElementById("imageInput");
  const filterSelect = document.getElementById("filterSelect");
  const textInput = document.getElementById("textInput");
  const fontSizeInput = document.getElementById("fontSizeInput");
  const sizeVal = document.getElementById("sizeVal");
  const textColorInput = document.getElementById("textColorInput");
  const qrInput = document.getElementById("qrInput");
  const downloadBtn = document.getElementById("downloadBtn");

  let currentImg = null;

  // 預設載入一張漸層風景示意圖，方便一打開網頁就能看到效果
  function createDefaultLandscape() {
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = 800;
    tempCanvas.height = 600;
    const tctx = tempCanvas.getContext("2d");

    const sky = tctx.createLinearGradient(0, 0, 0, 420);
    sky.addColorStop(0, "#38bdf8");
    sky.addColorStop(1, "#bae6fd");
    tctx.fillStyle = sky;
    tctx.fillRect(0, 0, 800, 420);

    // 太陽
    tctx.fillStyle = "#fde047";
    tctx.beginPath();
    tctx.arc(630, 130, 48, 0, Math.PI * 2);
    tctx.fill();

    // 草地
    const grass = tctx.createLinearGradient(0, 380, 0, 600);
    grass.addColorStop(0, "#4ade80");
    grass.addColorStop(1, "#15803d");
    tctx.fillStyle = grass;
    tctx.fillRect(0, 380, 800, 220);

    const img = new Image();
    img.onload = () => {
      currentImg = img;
      renderPostcard();
    };
    img.src = tempCanvas.toDataURL();
  }

  // 銳化卷積濾鏡處理
  function applySharpen(context, w, h) {
    const imgData = context.getImageData(0, 0, w, h);
    const data = imgData.data;
    const copy = new Uint8ClampedArray(data);
    const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        let r = 0, g = 0, b = 0;
        for (let ky = -1; ky <= 1; ky++) {
          for (let kx = -1; kx <= 1; kx++) {
            const idx = ((y + ky) * w + (x + kx)) * 4;
            const weight = kernel[(ky + 1) * 3 + (kx + 1)];
            r += copy[idx] * weight;
            g += copy[idx + 1] * weight;
            b += copy[idx + 2] * weight;
          }
        }
        const dstIdx = (y * w + x) * 4;
        data[dstIdx] = Math.min(255, Math.max(0, r));
        data[dstIdx + 1] = Math.min(255, Math.max(0, g));
        data[dstIdx + 2] = Math.min(255, Math.max(0, b));
      }
    }
    context.putImageData(imgData, 0, 0);
  }

  function renderPostcard() {
    if (!currentImg) return;

    const W = 800;
    const H = 600;
    const barHeight = 76;
    const imgHeight = H - barHeight;

    ctx.clearRect(0, 0, W, H);

    // 1. 繪製風景圖並套用濾鏡
    ctx.save();
    const filterType = filterSelect.value;
    if (filterType === "blur_sharpen") {
      ctx.filter = "blur(1.2px)";
    } else if (filterType === "vintage") {
      ctx.filter = "sepia(0.45) contrast(1.08) brightness(1.03)";
    } else if (filterType === "vivid") {
      ctx.filter = "saturate(1.45) contrast(1.12)";
    } else if (filterType === "grayscale") {
      ctx.filter = "grayscale(1)";
    } else {
      ctx.filter = "none";
    }

    ctx.drawImage(currentImg, 0, 0, W, imgHeight);
    ctx.restore();

    if (filterType === "blur_sharpen") {
      applySharpen(ctx, W, imgHeight);
    }

    // 2. 繪製下方文字底條
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, imgHeight, W, barHeight);

    // 3. 繪製自訂文字
    const fontSize = parseInt(fontSizeInput.value, 10);
    sizeVal.textContent = fontSize;
    ctx.font = `bold ${fontSize}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
    ctx.fillStyle = textColorInput.value;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";

    // 若有 QR Code，文字略微向左置中避開右下角
    const qrText = qrInput.value.trim();
    const textCenterX = qrText ? (W - 110) / 2 : W / 2;
    ctx.fillText(textInput.value, textCenterX, imgHeight + barHeight / 2);

    // 4. 產生並貼上 QR Code
    if (qrText) {
      const qrContainer = document.getElementById("hidden-qr");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: qrText,
        width: 128,
        height: 128,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      setTimeout(() => {
        const qrCanvas = qrContainer.querySelector("canvas");
        if (qrCanvas) {
          const qrSize = 96;
          const pad = 6;
          const x = W - qrSize - 16;
          const y = H - qrSize - 14;

          // 白色外框提升掃描成功率
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x - pad, y - pad, qrSize + pad * 2, qrSize + pad * 2);
          ctx.drawImage(qrCanvas, x, y, qrSize, qrSize);
        }
      }, 30);
    }
  }

  imageInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImg = img;
        renderPostcard();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  [filterSelect, textInput, fontSizeInput, textColorInput, qrInput].forEach((el) => {
    el.addEventListener("input", renderPostcard);
  });

  downloadBtn.addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "postcard.jpg";
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();
  });

  createDefaultLandscape();
</script>
</body>
</html>
